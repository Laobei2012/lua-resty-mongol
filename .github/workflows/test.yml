name: test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  OPENRESTY_VERSION: 1.31.1.1
  DEVEL_UTILS_SHA: 95e99dea5744d16d4078c867b1cfc5617f91efc7

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install OpenResty and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget gnupg ca-certificates lsb-release luarocks
          wget -O - https://openresty.org/package/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/openresty.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/openresty.gpg] http://openresty.org/package/ubuntu $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/openresty.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "openresty=${OPENRESTY_VERSION}-*"
          sudo luarocks install luacheck
      - name: luacheck
        run: luacheck -q lib
      - name: lj-releng
        run: |
          git clone https://github.com/openresty/openresty-devel-utils.git /tmp/devel-utils
          git -C /tmp/devel-utils checkout "$DEVEL_UTILS_SHA"
          export PATH=/usr/local/openresty/luajit/bin:$PATH
          for f in lib/resty/mongol/*.lua; do /tmp/devel-utils/lj-releng "$f"; done

  test:
    # mongo:8.0 refuses to start on Linux 6.19 and newer (SERVER-121912).
    # The ubuntu-24.04 image moved to such a kernel; ubuntu-22.04 ships 6.8.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mongo: ["6.0", "7.0", "8.0", "9.0"]
    services:
      mongo:
        image: mongo:${{ matrix.mongo }}
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install OpenResty and Test::Nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget gnupg ca-certificates lsb-release cpanminus
          wget -O - https://openresty.org/package/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/openresty.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/openresty.gpg] http://openresty.org/package/ubuntu $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/openresty.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "openresty=${OPENRESTY_VERSION}-*"
          sudo cpanm --notest Test::Nginx
      - name: Test
        run: make test

  auth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongo: ["6.0", "7.0", "8.0", "9.0"]
    services:
      mongo:
        image: mongo:${{ matrix.mongo }}
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install OpenResty and Test::Nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget gnupg ca-certificates lsb-release cpanminus
          wget -O - https://openresty.org/package/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/openresty.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/openresty.gpg] http://openresty.org/package/ubuntu $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/openresty.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "openresty=${OPENRESTY_VERSION}-*"
          sudo cpanm --notest Test::Nginx
      - name: Test with authentication
        run: make test-auth

  tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Make the test certificates
        run: sh t/tls/gen-certs.sh
      - name: Start MongoDB with TLS
        run: |
          docker run -d --name mongo-tls -p 27017:27017 \
            -v "$PWD/t/tls/certs:/certs:ro" mongo:9.0 \
            --tlsMode requireTLS \
            --tlsCertificateKeyFile /certs/server.pem \
            --tlsCAFile /certs/ca.pem \
            --tlsAllowConnectionsWithoutCertificates
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 27017 && break
            sleep 1
          done
      - name: Install OpenResty and Test::Nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget gnupg ca-certificates lsb-release cpanminus
          wget -O - https://openresty.org/package/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/openresty.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/openresty.gpg] http://openresty.org/package/ubuntu $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/openresty.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "openresty=${OPENRESTY_VERSION}-*"
          sudo cpanm --notest Test::Nginx
      - name: Test TLS
        run: make test-tls
